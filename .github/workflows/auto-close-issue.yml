name: Auto Close Linked Issues

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: read
  issues: write

concurrency:
  cancel-in-progress: true
  group: auto-close-issues-${{ github.ref }}

jobs:
  close-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Close referenced issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const closeIssue = body.includes("**DO NOT CLOSE**");

            const hasClosingKeyword = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+(?:issue\s+)?#\d+/i.test(body);

            const issueNumbers = [
              ...body.matchAll(
                /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved|issue|issues)\s+(?:issue\s+)?#(\d+)/gi
              ),
            ].map((m) => Number(m[1]));

            if (!issueNumbers.length) {
              core.info("No issues found. Bot goes back to sleep.");
              return;
            }

            for (const issue_number of issueNumbers) {
              try {
                const closedBy = context.payload.sender.login;

                if (!closeIssue && hasClosingKeyword) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number,
                    state: "closed",
                  });
                }

                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                });

                if(issue.state === "closed") {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number,
                    body: `✅ Closed via PR #${pr.number}${closedBy ? ` by @${closedBy}` : ""}.`,
                  }); 
                }

                if (
                  issue.state === "closed" &&
                  issue.labels.some((label) => label.name === "pending")
                ) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number,
                    name: "pending",
                  });
                }

                console.log(`Processed issue #${issue_number}`);
              } catch (err) {
                console.log(`Failed for #${issue_number}`, err);
              }
            }
